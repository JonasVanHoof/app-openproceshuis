name: Deploy frontend (development)

on:
  workflow_dispatch:
  push:
    branches: [deploy-workflow]

env:
  HOST: ${{ secrets.DEPLOY_HOST }}
  USER: ${{ secrets.DEPLOY_USER }}
  APP_DIR: ${{ vars.APP_DIR }}
  BRANCH: development

defaults:
  run:
    shell: bash # explicit bash = -eo pipefail, so ssh failures aren't hidden by `| tee`

jobs:
  preflight:
    name: Check if checkout is possible
    runs-on: ubuntu-latest
    outputs:
      current_branch: ${{ steps.inspect.outputs.current_branch }}
      checkout_possible: ${{ steps.inspect.outputs.checkout_possible }}
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Debug client key
        run: |
          ssh-keygen -y -f ~/.ssh/id_ed25519 || echo "private key unreadable / wrong format"

      - name: Inspect server repo (read-only)
        id: inspect
        run: |
          ssh "$USER@$HOST" bash -s -- "$APP_DIR" "$BRANCH" <<'SCRIPT' | tee preflight.txt
          set -e
          cd "$1"
          git fetch --quiet origin "$2"
          GITDIR=$(git rev-parse --git-dir)
          CURRENT=$(git rev-parse --abbrev-ref HEAD)
          echo "current_branch=$CURRENT"

          blockers=()
          [ -f "$GITDIR/MERGE_HEAD" ] && blockers+=("merge in progress")
          [ -f "$GITDIR/CHERRY_PICK_HEAD" ] && blockers+=("cherry-pick in progress")
          { [ -d "$GITDIR/rebase-merge" ] || [ -d "$GITDIR/rebase-apply" ]; } && blockers+=("rebase in progress")

          while read -r line; do
            [ -n "$line" ] && blockers+=("uncommitted change: $line")
          done < <(git status --porcelain --untracked-files=no)

          # untracked files that exist in origin/$2 would be overwritten by checkout
          while read -r f; do
            [ -n "$f" ] && git cat-file -e "origin/$2:$f" 2>/dev/null \
              && blockers+=("untracked file would be overwritten: $f")
          done < <(git ls-files --others --exclude-standard)

          # local $2 must be able to fast-forward to origin/$2
          if git rev-parse --verify --quiet "refs/heads/$2" >/dev/null \
             && ! git merge-base --is-ancestor "$2" "origin/$2"; then
            blockers+=("local $2 has commits not on origin:")
            while read -r c; do blockers+=("  $c"); done \
              < <(git log --oneline --no-decorate "origin/$2..$2")
          fi

          if [ ${#blockers[@]} -eq 0 ]; then
            echo "checkout_possible=true"
          else
            echo "checkout_possible=false"
            printf 'blocker=%s\n' "${blockers[@]}"
          fi
          SCRIPT
          grep -E '^(current_branch|checkout_possible)=' preflight.txt >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          {
            echo "### Server preflight (development)"
            echo '```'
            sed 's/^blocker=/blocker: /' preflight.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^checkout_possible=false' preflight.txt; then
            echo "::error title=Manual intervention needed::Cannot switch to $BRANCH on the server. See summary."
            exit 1
          fi

  check:
    name: Check for new commits
    needs: preflight
    environment: dev-approve-check # required reviewer = manual "start" button
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Compare server with origin
        id: compare
        env:
          CURRENT: ${{ needs.preflight.outputs.current_branch }}
        run: |
          ssh "$USER@$HOST" bash -s -- "$APP_DIR" "$BRANCH" "$CURRENT" <<'SCRIPT' | tee result.txt
          set -e
          cd "$1"
          if [ "$3" != "$2" ]; then
            echo "changed=true"
            echo
            echo "server is on '$3', will switch to '$2'"
            exit 0
          fi
          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse "origin/$2")
          echo "local=$LOCAL"
          echo "remote=$REMOTE"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "changed=false"
          else
            echo "changed=true"
            echo
            echo "new commits ($(git rev-list --count "HEAD..origin/$2")):"
            git log --oneline --no-decorate "HEAD..origin/$2"
          fi
          SCRIPT
          grep '^changed=' result.txt >> "$GITHUB_OUTPUT"

      - name: Report
        run: |
          {
            echo "### Changes (development)"
            echo '```'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q '^changed=false' result.txt; then
            echo "::notice title=Nothing to deploy::Server is already at the latest commit."
          fi

  deploy:
    name: Pull and restart frontend
    needs: check
    if: needs.check.outputs.changed == 'true'
    environment: dev-approve-deploy # required reviewer = manual "start" button
    concurrency: # only one actual deploy at a time, across all runs
      group: deploy-frontend-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Checkout, pull and restart
        run: |
          ssh "$USER@$HOST" bash -s -- "$APP_DIR" "$BRANCH" <<'SCRIPT'
          set -e
          cd "$1"
          git fetch --quiet origin "$2"
          git checkout "$2"
          git pull --ff-only origin "$2"
          echo "now at: $(git log -1 --oneline --no-decorate)"
          docker compose pull frontend
          docker compose up -d frontend
          docker compose ps frontend
          SCRIPT
