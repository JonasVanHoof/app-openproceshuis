x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    image: lblod/frontend-openproceshuis:1.6.5
    environment:
      EMBER_OAUTH_API_REDIRECT_URL: "https://openproceshuis.lblod.info/authorization/callback"
      EMBER_OAUTH_API_KEY: "aaf8877c-0975-4003-8db8-a9986355b80b"
      EMBER_OAUTH_API_BASE_URL: "https://authenticatie-ti.vlaanderen.be/op/v1/auth"
      EMBER_OAUTH_API_LOGOUT_URL: "https://authenticatie-ti.vlaanderen.be/op/v1/logout"
      EMBER_OAUTH_API_SCOPE: "openid rrn profile vo abb_openproceshuis"
      EMBER_OAUTH_SWITCH_URL: "https://openproceshuis.lblod.info/switch-login"
      EMBER_ANALYTICS_APP_DOMAIN: "openproceshuis.lblod.info" # Prod: openproceshuis.vlaanderen.be
      EMBER_ANALYTICS_API_HOST: "/plausible"
    volumes:
      - ./config/frontend/add-x-frame-options-header.conf:/config/add-x-frame-options.conf
    labels:
      - "logging=true"
    logging: *default-logging
    restart: always
  identifier:
    image: semtech/mu-identifier:1.10.3
    labels:
      - "logging=true"
    logging: *default-logging
    environment:
      SESSION_COOKIE_SECURE: "on"
      DEFAULT_MU_AUTH_ALLOWED_GROUPS_HEADER: '[{"variables":[],"name":"public"},{"variables":[],"name":"clean"}]'
    links:
      - dispatcher:dispatcher
    restart: always
  dispatcher:
    image: semtech/mu-dispatcher:2.1.0-beta.2
    logging: *default-logging
    labels:
      - "logging=true"
    links:
      - resource:resource
    volumes:
      - ./config/dispatcher:/config
    restart: always
  database:
    logging: *default-logging
    labels:
      - "logging=true"
    image: semtech/sparql-parser:0.0.14
    volumes:
      - ./config/authorization:/config
      - ./data/authorization:/data
    restart: always
  virtuoso:
    logging: *default-logging
    labels:
      - "logging=true"
    image: redpencil/virtuoso:1.4.0
    environment:
      SPARQL_UPDATE: "true"
      DEFAULT_GRAPH: "http://mu.semte.ch/application"
    volumes:
      - ./data/db:/data
      - ./config/virtuoso/virtuoso.ini:/data/virtuoso.ini
    restart: always
  sparql-endpoint-proxy:
    logging: *default-logging
    labels:
      - "logging=true"
    image: lblod/sparql-authorization-wrapper-service:1.1.1
    volumes:
      - ./config/sparql-endpoint-proxy:/config
    environment:
      DEFAULT_MU_AUTH_SCOPE: "http://services.semantic.works/sparql-endpoint-proxy"
      DATABASE_HOST: "http://database:8890"
  migrations:
    logging: *default-logging
    labels:
      - "logging=true"
    image: semtech/mu-migrations-service:0.9.0
    links:
      - virtuoso:database
    volumes:
      - ./config/migrations:/data/migrations
    restart: always
  resource:
    logging: *default-logging
    labels:
      - "logging=true"
    image: semtech/mu-cl-resources:1.27.2
    environment:
      CACHE_CLEAR_PATH: "http://cache/.mu/clear-keys"
    links:
      - database:database
    volumes:
      - ./config/resources:/config
    restart: always
  cache:
    image: semtech/mu-cache:2.0.2
    links:
      - resource:backend
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  deltanotifier:
    image: semtech/mu-delta-notifier:0.4.0
    volumes:
      - ./config/delta:/config
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  file:
    image: semtech/mu-file-service:3.5.1
    labels:
      - "logging=true"
    logging: *default-logging
    links:
      - database:database
    volumes:
      - ./data/files:/share
    environment:
      VALIDATE_READABLE_METADATA: "true"
    restart: always
  bpmn:
    logging: *default-logging
    labels:
      - "logging=true"
    image: lblod/openproceshuis-bpmn-service:2.1.1-0
    volumes:
      - ./config/bpmn:/config
      - ./data/files:/share
    restart: always
  visio:
    logging: *default-logging
    labels:
      - "logging=true"
    image: lblod/openproceshuis-visio-service:1.0.0
    volumes:
      - ./data/files:/share
    restart: always
  process:
    image: lblod/openproceshuis-process-service:0.0.4
    restart: always
    labels:
      - "logging=true"
    logging: *default-logging
  accountdetail:
    image: lblod/account-detail-service:0.1.0
    labels:
      - "logging=true"
    links:
      - database:database
    restart: always
    logging: *default-logging
  mock-bestuurseenheid-generator:
    image: lblod/update-bestuurseenheid-mock-login-service:0.5.0
    environment:
      RUN_CRON_ON_START: "true"
    volumes:
      - ./config/mock-login:/config
    restart: "no"

  ################################################################################
  # OP PUBLIC CONSUMER
  ################################################################################
  op-public-consumer:
    image: lblod/delta-consumer:0.1.4
    environment:
      DCR_SERVICE_NAME: "op-public-consumer"
      DCR_SYNC_BASE_URL: "https://organisaties.abb.vlaanderen.be"
      DCR_SYNC_FILES_PATH: "/sync/public/files"
      DCR_SYNC_DATASET_SUBJECT: "http://data.lblod.info/datasets/delta-producer/dumps/PublicCacheGraphDump"
      DCR_INITIAL_SYNC_JOB_OPERATION: "http://redpencil.data.gift/id/jobs/concept/JobOperation/deltas/consumer/initialSync/op-public"
      DCR_DELTA_SYNC_JOB_OPERATION: "http://redpencil.data.gift/id/jobs/concept/JobOperation/deltas/consumer/deltaSync/op-public"
      DCR_JOB_CREATOR_URI: "http://data.lblod.info/services/id/op-public-consumer"
      DCR_KEEP_DELTA_FILES: "true"
      DCR_DELTA_JOBS_RETENTION_PERIOD: "30"
      DCR_ENABLE_TRIPLE_REMAPPING: "true"
      DCR_LANDING_ZONE_GRAPH: "http://mu.semte.ch/graphs/op/landing"
      DCR_REMAPPING_GRAPH: "http://mu.semte.ch/graphs/public"
      DCR_DISABLE_INITIAL_SYNC: "true"
      DCR_DISABLE_DELTA_INGEST: "false"
      DCR_BATCH_SIZE: 1000
      SUDO_QUERY_RETRY_FOR_HTTP_STATUS_CODES: "404,500,503"
      SUDO_QUERY_RETRY: "true"
    volumes:
      - ./config/op-consumer/mapping:/config/mapping
      - ./data/consumer-files/op-public:/consumer-files/
    restart: always
    labels:
      - "logging=true"
    logging: *default-logging

  ################################################################################
  # ACM/IDM
  ################################################################################
  login:
    image: lblod/acmidm-login-service:0.12.0
    environment:
      MU_APPLICATION_AUTH_USERID_CLAIM: "vo_id"
      MU_APPLICATION_AUTH_ROLE_CLAIM: "abb_openproceshuis_rol_3d"
      MU_APPLICATION_GRAPH: "http://mu.semte.ch/graphs/public"
      MU_APPLICATION_AUTH_DISCOVERY_URL: "https://authenticatie-ti.vlaanderen.be/op"
      MU_APPLICATION_AUTH_CLIENT_ID: "aaf8877c-0975-4003-8db8-a9986355b80b"
      MU_APPLICATION_AUTH_REDIRECT_URI: "https://openproceshuis.lblod.info/authorization/callback"
      MU_APPLICATION_AUTH_CLIENT_SECRET: "secret"
    restart: always
    labels:
      - "logging=true"
    logging: *default-logging
  impersonation:
    image: lblod/impersonation-service
    restart: always
    labels:
      - "logging=true"
    logging: *default-logging
  ################################################################################
  # Integration services
  ################################################################################  
  m2m:
    image: lblod/m2m-login-service:0.1.1
    environment:
      MU_APPLICATION_GRAPH: "http://mu.semte.ch/graphs/public"
      MU_APPLICATION_AUTH_DISCOVERY_URL: "https://authenticatie.vlaanderen.be/.well-known/oauth-authorization-server/op"
      BH_APPLICATION_NAME: OpenProcesHuis-Procesbeheerder
    restart: always
    labels:
      - "logging=true"
    logging: *default-logging
  vendor-api:
    image: lblod/vendor-api-openproceshuis-service:0.0.5
    restart: always
    environment:
      ALLOW_MU_AUTH_SUDO: true
      ERROR_RESOURCE_TYPE_URI: "http://open-services.net/ns/core#Error" # Same as the delta rule error-alert
      ERROR_GRAPH_URI: "http://mu.semte.ch/graphs/integration/vendor-api/errors"
      SEND_MAIL_ON_THRESHOLD: false
      ERROR_GRACE_PERIOD_IN_MINUTES: 5
      ERROR_THRESHOLD_OCCURRENCES: 2
    labels:
      - "logging=true"
    logging: *default-logging
  swagger:
    image: swaggerapi/swagger-ui:v5.32.0
    restart: always
    environment:
      SWAGGER_JSON: /spec/openapi.yml
    volumes:
      - ./config/integration/json-ld-api/openapi.yml:/spec/openapi.yml:ro
      # Override as we do not want the user to set authorize, they have to do this by login in into our OPH environment!
      - ./config/integration/json-ld-api/index.html:/usr/share/nginx/html/index.html
      - ./config/integration/json-ld-api/hide-authorize-btn.css:/usr/share/nginx/html/hide-authorize-btn.css
    labels:
      - 'logging=true'
    logging: *default-logging
  shared-processes-consumer:
    image: lblod/ldes-client:0.0.4
    profiles:
      - futureIntegrationFeature
    volumes:
      - ./config/shared-processes-consumer:/config
    restart: always
    environment:
      BATCH_SIZE: 100
      CRON_PATTERN: "3 * * * *" # Every hour at minute 3
      LDES_BASE: https://dev.openproceshuis.lblod.info/streams/ldes/public/
      FIRST_PAGE: https://dev.openproceshuis.lblod.info/streams/ldes/public/1
      STATUS_GRAPH: http://mu.semte.ch/graphs/shared-processes/status
      TARGET_GRAPH: http://mu.semte.ch/graphs/shared-processes
      WORKING_GRAPH: http://mu.semte.ch/graphs/shared-processes-tmp
      DIRECT_DATABASE_CONNECTION: 'http://virtuoso:8890/sparql'
      RANDOMIZE_GRAPHS: true
    labels:
      - "logging=true"
    logging: *default-logging
  error-alert:
    image: lblod/loket-error-alert-service:1.0.2
    environment:
      APP_NAME: 'Open Proces Huis'
      EMAIL_HELP: "loketlokaalbestuur@vlaanderen.be"
      EMAIL_FROM: "loketlokaalbestuur@vlaanderen.be"
      EMAIL_TO: "123@example.com"
      ERROR_TEMPLATE: "/mnt/templates/error.hbs"
    volumes:
      - ./config/error-alert/config.json:/config/config.json
      - ./config/error-alert/error.hbs:/mnt/templates/error.hbs:ro
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging

  deliver-email:
    image: redpencil/deliver-email-service:1.0.0
    profiles:
      - sendEmails
    environment:
      MAILBOX_URI: "http://data.lblod.info/id/mailboxes/1"
      SECURE_CONNECTION: "true"
      EMAIL_PROTOCOL: "smtp"
      EMAIL_ADDRESS: "loketlokaalbestuur@vlaanderen.be"
      EMAIL_PASSWORD: "myemailpassword"
      FROM_NAME: "Open Proces Huis"
      WELL_KNOWN_SERVICE: "Outlook365"
      NODE_ENV: "production"
      EMAIL_CRON_PATTERN: "*/5 * * * *" # Every 5 minutes
      LOG_ERRORS: true
    volumes:
      - ./data/mail:/share
    labels:
      - "logging=true"
    restart: always
    logging: *default-logging
  ################################################################################
  # IPDC PROXY
  ################################################################################
  ipdc-proxy:
    image: lblod/api-proxy-service:1.0.2
    links:
      - virtuoso:database
    environment:
      API_URL: "https://api.ipdc.tni-vlaanderen.be"
      API_KEY: "secret"
      REQUIRED_ROLES: "OpenProcesHuis-Procesbeheerder,LoketLB-admin,Lezer,OpenProcesHuis-Lezer,Medewerker-fixed"
    restart: always
    labels:
      - "logging=true"
    logging: *default-logging
  plausible-proxy:
    image: lblod/api-proxy-service:1.0.2
    links:
      - virtuoso:database
    environment:
      API_URL: "https://plausible.lblod.info"
      API_KEY: ""
    restart: always
    labels:
      - "logging=true"
    logging: *default-logging

  ################################################################################
  # REPORTING
  ################################################################################
  report-generation:
    image: lblod/loket-report-generation-service:0.8.2
    environment:
      DEFAULT_GRAPH: "http://mu.semte.ch/graphs/reports"
      ONLY_KEEP_LATEST_REPORT: "true"
    links:
      - virtuoso:database
    volumes:
      - ./data/files:/share
      - ./config/reports:/config
    restart: always
    labels:
      - "logging=true"
    logging: *default-logging
  anonymization:
    image: lblod/pii-identification-anonymization-service
    restart: always
  modified:
    image: lblod/track-modified-service:0.2.0
    environment:
      CLEANUP_DUPLICATES_CRON: 16 * * * *
      CLEANUP_AT_START: "true"
    labels:
      - "logging=true"
    volumes:
      - ./config/modified:/config
    restart: always
    logging: *default-logging

  ################################################################################
  # LDES
  ################################################################################
  ldes-serve-feed:
    image: lblod/ldes-serve-feed-service:0.4.0
    restart: always
    environment:
      BASE_URL: "https://dev.openproceshuis.lblod.info/streams/ldes/"
      TIME_TREE_RELATION_PATH: "http://www.w3.org/ns/prov#generatedAtTime"
      DATA_FOLDER: "/data"
      LDES_FOLDER: "public"
      AUTHENTICATED_LDES_FEED: false
      ALLOW_MU_AUTH_SUDO: true
    volumes:
      - ./data/ldes-feed:/data
    logging: *default-logging
    labels:
      - "logging=true"
  ldes-delta-pusher:
    image: redpencil/ldes-delta-pusher:1.2.9
    restart: always
    environment:
      CRON_HEALING: "0 0 0 * * *" # Every day at midnight
      AUTO_HEALING: "true"
      FOLDER_DEPTH: "1"
      PAGE_RESOURCES_COUNT: "10"
      LDES_STREAM_PREFIX: "https://dev.openproceshuis.lblod.info/streams/ldes/"
      LDES_BASE: "https://dev.openproceshuis.lblod.info/streams/ldes/"
      TIME_TREE_RELATION_PATH: "http://www.w3.org/ns/prov#generatedAtTime"
      CACHE_SIZE: "1000"
      DATA_FOLDER: "/data"
      LDES_FOLDER: "public"
      CRON_CHECKPOINT: "0 5 1 * *" # At 05:00 on day-of-month 1
      SUDO_QUERY_RETRY_TIMEOUT_INCREMENT_FACTOR: 0.003
      SUDO_QUERY_RETRY_FOR_HTTP_STATUS_CODES: 429,500,502,503,504
      MAX_PAGE_SIZE_BYTES: 10000
      INITIAL_STATE_LIMIT: 10000
      HEALING_LIMIT: 10000
      DIRECT_DB_ENDPOINT: "http://virtuoso:8890/sparql"
      WRITE_INITIAL_STATE: "false"
    volumes:
      - ./config/ldes-delta-pusher/:/config/
      - ./data/ldes-feed/:/data/
    logging: *default-logging
    labels:
      - "logging=true"

